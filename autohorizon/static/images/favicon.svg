<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0e8f2"/>
      <stop offset="100%" stop-color="#b3d4e6"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>

  <!-- Base bottom (wider) -->
  <path d="M132,365 L132,350 Q132,344 138,344 L272,344 Q278,344 278,350 L278,365 Q278,371 272,371 L138,371 Q132,371 132,365 Z"
        fill="#3a6a8a" stroke="#1e2d3d" stroke-width="5.5" stroke-linejoin="round"/>

  <!-- Base top (narrower, stacked) -->
  <path d="M152,344 L152,316 Q152,310 158,310 L252,310 Q258,310 258,316 L258,344"
        fill="#4a7fa0" stroke="#1e2d3d" stroke-width="5.5" stroke-linejoin="round"/>

  <!-- Base pivot joint -->
  <circle cx="205" cy="310" r="13" fill="#4a7fa0" stroke="#1e2d3d" stroke-width="5"/>
  <circle cx="205" cy="310" r="5" fill="#1e2d3d"/>

  <!-- Lower arm (base to elbow) — polygon shape for proper arm look -->
  <polygon points="196,302 162,218 178,212 212,296"
           fill="#e8eef2" stroke="#1e2d3d" stroke-width="5.5" stroke-linejoin="round"/>

  <!-- Elbow joint -->
  <circle cx="170" cy="215" r="15" fill="#3a6a8a" stroke="#1e2d3d" stroke-width="5"/>
  <circle cx="170" cy="215" r="6" fill="#1e2d3d"/>

  <!-- Upper arm (elbow to shoulder) — polygon shape -->
  <polygon points="178,207 274,154 282,168 186,223"
           fill="#e8eef2" stroke="#1e2d3d" stroke-width="5.5" stroke-linejoin="round"/>

  <!-- Shoulder joint -->
  <circle cx="278" cy="160" r="18" fill="#3a6a8a" stroke="#1e2d3d" stroke-width="5"/>
  <circle cx="278" cy="160" r="7" fill="#1e2d3d"/>

  <!-- Forearm (shoulder to wrist) — thinner segment -->
  <polygon points="284,168 336,214 328,222 276,174"
           fill="#e8eef2" stroke="#1e2d3d" stroke-width="5" stroke-linejoin="round"/>

  <!-- Wrist joint -->
  <circle cx="332" cy="218" r="9" fill="#3a6a8a" stroke="#1e2d3d" stroke-width="4.5"/>

  <!-- Gripper — two prongs, cleaner L-shapes -->
  <polyline points="332,218 358,240 370,228"
            fill="none" stroke="#1e2d3d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="332,218 348,248 336,258"
            fill="none" stroke="#1e2d3d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gear (auto) -->
  <g transform="translate(333,292)">
    <path d="M-3,-36 L5,-36 L7,-28 L14,-24 L20,-30 L26,-24 L20,-17 L22,-10 L30,-8 L30,-1 L22,1 L20,8 L26,14 L20,20 L14,14 L7,17 L5,25 L-3,25 L-5,17 L-12,14 L-18,20 L-24,14 L-18,8 L-20,1 L-28,-1 L-28,-8 L-20,-10 L-18,-17 L-24,-24 L-18,-30 L-12,-24 L-5,-28 Z"
          fill="#808e8e" stroke="#1e2d3d" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="1" cy="-5.5" r="13" fill="#a8b8b8" stroke="#1e2d3d" stroke-width="4"/>
    <circle cx="1" cy="-5.5" r="5.5" fill="#808e8e" stroke="#1e2d3d" stroke-width="3"/>
  </g>

  <!-- Horizon line with arrow -->
  <line x1="80" y1="400" x2="428" y2="400" stroke="#0d9488" stroke-width="5" stroke-linecap="round"/>
  <polygon points="420,393 434,400 420,407" fill="#0d9488"/>

  <!-- Tick marks (non-uniform spacing = adaptive horizon) -->
  <line x1="130" y1="394" x2="130" y2="406" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
  <line x1="190" y1="392" x2="190" y2="408" stroke="#0d9488" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="232" y1="394" x2="232" y2="406" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
  <line x1="305" y1="392" x2="305" y2="408" stroke="#0d9488" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="370" y1="394" x2="370" y2="406" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
</svg>
